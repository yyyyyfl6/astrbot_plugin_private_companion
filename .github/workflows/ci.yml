name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check patch whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show --check --oneline -m --first-parent HEAD
          else
            git show --check --oneline HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Manifest is valid JSON with a matching version in index-entry.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('private-companion/plugin.json', 'utf8'));
            const e = JSON.parse(fs.readFileSync('index-entry.json', 'utf8'));
            if (m.version !== e.version) { console.error('version mismatch', m.version, e.version); process.exit(1); }
            if (!fs.existsSync('dist/private-companion-' + m.version + '.tar.gz')) { console.error('missing dist package'); process.exit(1); }
          "
